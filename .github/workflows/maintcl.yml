name: Compila Tutti i Kext
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4

    - name: Scarica MacKernelSDK
      run: git clone https://github.com/acidanthera/MacKernelSDK

    - name: Scarica Lilu 1.7.2
      run: |
        curl -L -o Lilu.zip https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-DEBUG.zip
        unzip Lilu.zip -d Lilu_Folder
        cp -R Lilu_Folder/Lilu.kext .

    - name: Compila Tutto
      run: python3 tools/build.py

    - name: Salva intera cartella Build
      uses: actions/upload-artifact@v4
      with:
        name: Cartella-Build-Completa
        path: build/
