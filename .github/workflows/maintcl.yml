name: Compila Tutti i Kext
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4

    - name: Scarica MacKernelSDK
      run: git clone https://github.com/acidanthera/MacKernelSDK

    - name: Scarica Lilu
      run: |
        curl -L -o Lilu.zip https://github.com/acidanthera/Lilu/releases/latest/download/Lilu-DEBUG.zip
        unzip Lilu.zip -d Lilu_Folder
        cp -R Lilu_Folder/Lilu.kext .

    - name: Compila TUTTI i target (WhateverXe + Compat)
      run: |
        python3 tools/build.py || true
        xcodebuild -alltargets -configuration Release || true

    - name: Salva i Kext generati
      uses: actions/upload-artifact@v4
      with:
        name: Kext-Finali
        path: '**/*.kext'
